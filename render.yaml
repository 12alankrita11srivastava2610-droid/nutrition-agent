services:
  - type: web
    name: nutriai
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: IBM_WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: IBM_GRANITE_MODEL_ID
        value: ibm/granite-3-1-8b-base
      - key: IBM_API_KEY
        sync: false          # you fill this in the Render dashboard
      - key: IBM_PROJECT_ID
        sync: false          # you fill this in the Render dashboard
      - key: NUTRITIONIX_APP_ID
        sync: false
      - key: NUTRITIONIX_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
